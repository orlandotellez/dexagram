name: Build Dexagram (Windows)

# Se dispara a mano desde la pestaña Actions de GitHub.
# El .exe de Windows solo puede compilarse en un runner Windows:
# desde Linux Tauri genera únicamente los bundles de Linux.
#
# Ojo con las versiones de Tauri: el paquete de npm y el crate de Rust tienen
# que estar en el mismo major.minor (tauri <-> @tauri-apps/api). Si `tauri build`
# falla con "version mismatched Tauri packages", actualizá los dos lockfiles
# juntos: bun.lock y src-tauri/Cargo.lock.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Tauri (Windows)
        run: bun tauri build

      - name: Upload instaladores
        uses: actions/upload-artifact@v4
        with:
          name: dexagram
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
